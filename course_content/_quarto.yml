quarto-required: ">= 1.8.26"

project:
  title: "AI Pros Bootcamp"
  output-dir: output
  execute-dir: project
  render:
    - "*.qmd"
    - "!**/README.md"
  preview:
    port: 4200
    browser: false
    navigate: false

execute:
  echo: false
  warning: false
  message: false

format:
  revealjs:
    slide-number: c/t
    show-slide-number: all
    embed-resources: true
    preview-links: true
    transition: slide
    background-transition: fade
    chalkboard: false
    multiplex: false
    help: true
    progress: true
    history: false
    hide-inactive-cursor: true
    strip-comments: true
    center: false
    incremental: false
    code-copy: true
    code-line-numbers: true
    scrollable: false
    pdf-separate-fragments: false
    filters: 
      - ./assets/splash.lua
    plugins: [menu]
    menu:
      custom:
        - title: "Index"
          icon: "<svg width='1.8rem' viewBox='0 0 24 24'><path d='M5 7h14M5 12h14M5 17h7' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>"
          src: "../index.html"
